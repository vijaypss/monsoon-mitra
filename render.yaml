# Render Blueprint — deploys the backend (free web service) and the frontend
# (free static site) together. In the Render dashboard: New → Blueprint → point
# it at this repo. Docs: https://render.com/docs/blueprint-spec
services:
  # ── Backend API (free web service) ──
  - type: web
    name: monsoon-mitra-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false          # set this secret in the dashboard
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: RATE_LIMIT
        value: 30/minute
      # After the static site is live, set this to its URL for CORS:
      - key: ALLOWED_ORIGINS
        value: https://monsoon-mitra-web.onrender.com

  # ── Frontend (free static site) ──
  - type: web
    name: monsoon-mitra-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Point the SPA at the API service above (fill in its real URL):
      - key: VITE_API_BASE_URL
        value: https://monsoon-mitra-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
